name: Multi-Dealer Laptop Scraper

on:
  # 16/08/2026: Bo GitHub schedule (khong tin cay - thuc te bi GitHub bo
  # qua/tre nhieu vao gio cao diem, da test lai va van bi tre ~36 phut).
  # Nguon trigger duy nhat gio la CRON TREN VPS RIENG (hermes-gateway, GCP
  # e2-micro free tier, luon-on, khong phu thuoc may Windows nao) - script
  # /home/hoang/trigger-scrape.sh goi workflow_dispatch API luc 01h/04h/08h
  # UTC (= 8h/11h/15h VN) qua crontab. Dieu kien if cua cac job van check ca
  # github.event_name == 'schedule' de du phong neu sau nay bat lai.
  # 22/08/2026: Da sua crontab tren VPS (them CRON_TZ=Asia/Ho_Chi_Minh +
  # doi gio thanh 8,11,15) nen KHONG bat lai GitHub schedule - de tranh moi
  # slot chay 2 lan (cron VPS + schedule) gay trung alert Telegram.
  workflow_dispatch:
    inputs:
      run_scrape:
        description: 'Chay pipeline scrape day du (MBW+FPT+CPS+PV+ghi Sheet) - binh thuong de TRUE'
        type: boolean
        default: true
      run_reenrich_dashboard:
        description: 'CHI re-enrich dashboard/data.csv tu Part# moi nhat (khong scrape, ~30-60s) - dung khi vua sua Part#'
        type: boolean
        default: false
      # 26/08/2026: nhanh Bright Data truoc day CHI chay duoc khi ca 2 may
      # self-hosted cung off -> khong the test neu khong tat may. Do do bug
      # "detectBrand is not defined" song sot 20 ngay ma khong ai biet (run
      # #499/#500 fail, phat hien tinh co). Input nay cho phep ep chay nhanh
      # fallback bat ky luc nao de kiem thu.
      force_fallback:
        description: 'TEST: ep chay nhanh Bright Data (FPT+PV) du may self-hosted dang online - binh thuong de FALSE'
        type: boolean
        default: false
      first_run_allow_empty:
        description: 'CHI dung lan dau tien: cho phep ghi vao Google Sheet dang trong (bo qua guard "existingRows = 0"). Bo TICK lai sau lan dau.'
        type: boolean
        default: false
  # [FORK thanhanphatpc/laptopspects] Bat lai GitHub schedule (repo goc da tat
  # vi cron GitHub hay tre ~36 phut va ho dung VPS rieng thay the - fork nay
  # khong co VPS nao nen dung schedule chuan cua GitHub, chap nhan co the tre
  # vai chuc phut vao gio cao diem).
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 08:00 gio Viet Nam, hang ngay

# Chan 2 LAN CHAY (workflow run) chong nhau — van giu nguyen tu ban fix
# truoc, vi neu 2 lan trigger trung gio thi van co the co 2 bo "3 job song
# song + 1 job ghi" chay chong len nhau, gay dung 1 loai race condition da
# fix hom qua nhung o cap do khac.
concurrency:
  group: scrape-pipeline
  cancel-in-progress: false

# 26/08/2026: Ep MUI GIO VIET NAM cho toan bo workflow.
# Van de: cac job ghi du lieu (write-sheet) chay tren ubuntu-latest = UTC, nen
# cot "Time" trong tab "Daily SRP Tracking" va cot "Hour" trong dashboard/data.csv
# bi ghi theo gio UTC (vd 04:41 thay vi 11:41 VN). Nguyen nhan: ham format o
# multi_dealer_scraper.js (dong 456/459) va enrich-and-export.js (dong 50/53)
# dung d.getDate()/d.getHours() — tuc GIO LOCAL CUA RUNNER.
# Node doc bien moi truong TZ nen dat o day la sua ca 2 script cung luc, khong
# phai sua dong code JS nao. Cac runner self-hosted (BARACK/MSI) von da o gio
# VN nen khong bi anh huong.
env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  # 06/08/2026: Job kiem tra truoc tien - cac may self-hosted (BARACK/MSI) co
  # dang online khong. Neu KHONG co may nao online, scrape-fpt-online (Bright
  # Data, chay tren cloud) se duoc dung thay scrape-fpt (self-hosted) — tranh
  # viec job self-hosted cho vo han (khong co runner nhan job) den khi het
  # timeout-minutes, lam nghen ca pipeline. Mac dinh khi API loi (khong ro
  # trang thai thuc su) -> gia dinh ONLINE (an toan hon, vi tu choi nham sang
  # Bright Data se ton tien khong can thiet; con tu choi nham sang self-hosted
  # khi thuc su offline chi lam job do fail/timeout, khong ton tien).
  check-runners:
    name: Check may self-hosted (BARACK/MSI) online?
    if: ${{ inputs.run_scrape || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      online: ${{ steps.check.outputs.online }}
    steps:
      - name: Kiem tra trang thai runner qua GitHub API
        id: check
        env:
          # FIX 06/08/2026: GITHUB_TOKEN mac dinh KHONG the doc danh sach
          # self-hosted runner (khong co scope "administration" hop le trong
          # workflow permissions: block — GH API tra 422 khi khai bao). Dung
          # PAT rieng (RUNNER_CHECK_PAT, tao qua Settings > Secrets, co scope
          # repo admin) thay the.
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_PAT }}
        run: |
          RESULT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" || echo "")
          ONLINE_COUNT=$(echo "$RESULT" | jq '[.runners[]? | select(.status=="online")] | length' 2>/dev/null || echo "")
          if [ -z "$ONLINE_COUNT" ]; then
            echo "⚠ Khong doc duoc trang thai runner (loi API) — gia dinh ONLINE de an toan"
            echo "online=true" >> "$GITHUB_OUTPUT"
          elif [ "$ONLINE_COUNT" -gt 0 ]; then
            echo "✅ Co $ONLINE_COUNT may self-hosted online"
            echo "online=true" >> "$GITHUB_OUTPUT"
          else
            echo "🔴 KHONG co may self-hosted nao online — FPT se dung Bright Data (online fallback)"
            echo "online=false" >> "$GITHUB_OUTPUT"
          fi
          echo "--- Chi tiet ---"
          echo "$RESULT" | jq '[.runners[]? | {name, status}]' 2>/dev/null || echo "$RESULT"

  # 30/07/2026 [v3.5.0]: tach MBW/CPS/FPT thanh 3 job scrape SONG SONG THAT
  # SU (khong con needs: tuan tu giua chung) de tiet kiem thoi gian tong —
  # truoc day scrape-fpt phai doi scrape-cloud xong moi chay, tong thoi gian
  # = MBW+CPS + FPT cong don. Gio 3 job chay cung luc, tong thoi gian chi con
  # = max(MBW+CPS, FPT).
  #
  # DIEM MAU CHOT: ca 3 job nay CHI scrape roi luu ra file JSON (WRITE_MODE=
  # file), TUYET DOI KHONG dung tuc ghi vao Google Sheet. Neu de 3 job cung
  # ghi Sheet cung luc se tai tao dung bug da mat cong tim ra va fix hom qua
  # (28-29/07/2026): nhieu tien trinh doc-sua-ghi RAW DATA cung luc gay mat
  # data/loi. Buoc ghi Sheet duy nhat nam o job write-sheet ben duoi, chi
  # chay SAU KHI ca 3 job scrape da xong (needs), dam bao chi co 1 tien trinh
  # dung tuc dung vao Google Sheet tai bat ky thoi diem nao.
  scrape-mbw:
    if: ${{ inputs.run_scrape || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Scrape MBW (chi luu file, chua ghi Sheet)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MBW_PROXY_HOST: ${{ secrets.MBW_PROXY_HOST }}
          SCRAPE_DEALERS: MBW
          WRITE_MODE: file
        shell: bash
        run: npm start

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-mbw-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] MBW (scrape)%0Amay: cloud (ubuntu-latest)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  scrape-cps:
    if: ${{ inputs.run_scrape || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Scrape CPS (chi luu file, chua ghi Sheet)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SCRAPE_DEALERS: CPS
          WRITE_MODE: file
        run: npm start

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-cps-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] CPS (scrape)%0Amay: cloud (ubuntu-latest)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # 06/08/2026: Da test that - Phong Vu (phongvu.vn) DUNG Cloudflare bot-
  # challenge ("verifies you are not a bot", Ray ID) CHAN IP cloud (ubuntu-
  # latest) - trang tra ve 0 SP (page challenge thay vi content thuc).
  # Cung code nay chay OK tren may nha/office VN (BARACK, 400 SP). Giong
  # HOAN TOAN case FPT - chuyen sang self-hosted thay vi cloud.
  # 26/08/2026: PV chuyen sang goi API JSON cua Teko (backend that su cua
  # phongvu.vn) thay vi dieu khien trinh duyet. Trang HTML bi Cloudflare chan IP
  # cloud, nhung API thi KHONG — da do bang workflow probe tren ubuntu-latest.
  #
  # So voi scrapePV() qua Puppeteer:
  #   - 3 giay thay vi ~138s + ~4 phut recovery
  #   - khong phu thuoc toc do may (bug 26/08: BARACK cham -> 220/404 card)
  #   - co `total` do API khai bao de doi chieu, khong phai doan
  #   - het hien tuong 43 dong ma moi ngay: buoc recovery tra link luu tu ngay
  #     truoc (promo id cu) roi them dong TRUNG SP nhung KHONG co gia -> PV hien
  #     433 dong trong khi so that la 384
  #
  # Da doi chieu voi du lieu DOM ghi vao Sheet ngay 26/08: 384/384 SP khop link,
  # 0 SP chi co trong API, 0 lech gia.
  #
  # RUI RO: API noi bo, Teko co the doi schema/them auth bat ky luc nao. Vi vay
  # 2 job duoi (scrape-pv self-hosted va scrape-pv-online Bright Data) van giu
  # nguyen lam duong lui, chi chay khi job nay KHONG success.
  scrape-pv-api:
    name: Scrape PV (Teko API - khong can trinh duyet)
    needs: check-runners
    if: ${{ (inputs.run_scrape || github.event_name == 'schedule') && !inputs.force_fallback }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Lay PV qua Teko API (chi luu file)
        run: node pv_api.js

      # CHI upload khi thanh cong: neu that bai ma van upload artifact rong thi
      # se dung ten voi artifact cua job du phong -> upload-artifact@v4 bao loi.
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-pv-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] Phong Vu (Teko API)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # Duong lui 1: API hong + co may self-hosted online.
  scrape-pv:
    needs: [check-runners, scrape-pv-api]
    # [FORK thanhanphatpc/laptopspects] Tat: fork nay khong co may self-hosted,
    # job nay se treo cho runner vo thoi han neu bat. PV da du dung qua
    # scrape-pv-api (Teko API, chay tren cloud, mien phi) o tren.
    if: false
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Scrape PV (chi luu file, chua ghi Sheet)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SCRAPE_DEALERS: PV
          WRITE_MODE: file
        run: npm start

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-pv-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUNNER_NAME: ${{ runner.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] Phong Vu (scrape)%0Amay: ${RUNNER_NAME}%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # FPT Retail - fptshop.com.vn chan bang Cloudflare bot-challenge (KHONG phai
  # chan IP), bat buoc self-hosted. Giu label chung 'self-hosted' de MSI va
  # BARACK deu nhan duoc - co che du phong co chu dich, DUNG ghim may cu the.
  scrape-fpt:
    needs: check-runners
    # [FORK thanhanphatpc/laptopspects] Tat: can may self-hosted rieng, fork
    # nay chua co. FPT tam thoi bo qua theo lua chon cua Anh Thanh.
    if: false
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Scrape FPT (chi luu file, chua ghi Sheet)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SCRAPE_DEALERS: FPT
          WRITE_MODE: file
        run: npm start

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-fpt-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUNNER_NAME: ${{ runner.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] FPT (scrape)%0Amay: ${RUNNER_NAME}%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # 06/08/2026: Fallback KHI khong co may self-hosted nao online — scrape FPT
  # qua Bright Data Browser API (chay tren cloud, khong can may Phuc bat).
  # CHI lay model/gia/tinh trang/link — KHONG parse CPU/RAM/GPU/... tu card
  # (khong tiet kiem chi phi Bright Data - xem giai thich - nhung don gian
  # code, va cac truong nay se duoc dien lai boi buoc enrichment tu tab
  # "Part #" o job write-sheet nhu MBW/CPS/FPT deu dang lam). Ghi ra CUNG
  # DINH DANG products-FPT.json nhu scrape-fpt tu host, de write-sheet doc
  # gop binh thuong khong can sua logic combine.
  scrape-fpt-online:
    name: Scrape FPT (Bright Data - fallback khi may offline)
    needs: check-runners
    # [FORK thanhanphatpc/laptopspects] Tat: can secret BRIGHTDATA_BROWSER_WS
    # (dich vu tra phi) ma fork nay chua dang ky. FPT tam thoi bo qua.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Scrape FPT qua Bright Data (chi luu file)
        env:
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
        run: node fpt_online_fallback.js

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-fpt-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] FPT (Bright Data fallback - may self-hosted offline)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # 26/08/2026: fallback Bright Data cho Phong Vu — song song voi
  # scrape-fpt-online. Truoc do CHI FPT co fallback, nen ngay nao ca 2 may off
  # la PV mat trang du lieu (da xay ra that o run #507: dashboard/data.csv
  # ngay 26/08 khong con dong "Phong Vu" nao). PV bi Cloudflare bot-challenge
  # chan IP cloud y het FPT — cung cach giai quyet.
  # Duong lui 2: API hong + khong may nao online (hoac dang ep test fallback).
  scrape-pv-online:
    name: Scrape PV (Bright Data - fallback khi may offline)
    needs: [check-runners, scrape-pv-api]
    # [FORK thanhanphatpc/laptopspects] Tat: can secret BRIGHTDATA_BROWSER_WS
    # (dich vu tra phi) ma fork nay chua dang ky. PV da du dung scrape-pv-api.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Scrape PV qua Bright Data (chi luu file)
        env:
          BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
        run: node pv_online_fallback.js

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-pv-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] Phong Vu (Bright Data fallback - may self-hosted offline)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # An Phat (anphatpc.com.vn) — 02/09/2026.
  # API JSON noi bo, ~937 SP trong ~30s, khong can trinh duyet -> chay tren
  # ubuntu-latest, khong ton runner self-hosted. KHONG co duong lui Puppeteer:
  # neu API hong thi job fail va write-sheet van ghi cac dealer khac binh thuong
  # (An Phat chi la dealer tham chieu, khong phai nguon so lieu chinh).
  scrape-apc:
    name: Scrape An Phat (API noi bo)
    needs: check-runners
    if: ${{ (inputs.run_scrape || github.event_name == 'schedule') && !inputs.force_fallback }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      # Chua xac nhan An Phat co chan IP datacenter hay khong (test 02/09 chay
      # tu IP nha, khong phai IP cloud). Neu log bao EMPTY_BODY hoac status 403
      # thi bo comment dong MBW_PROXY_HOST duoi day de di qua Cloudflare Worker
      # (/__proxy/apc) — worker da duoc them target 'apc'.
      - name: Lay An Phat qua API (chi luu file)
        env:
          OUTPUT_DIR: scrape-output
          # MBW_PROXY_HOST: ${{ secrets.MBW_PROXY_HOST }}
        run: node apc_api.js

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-apc-output
          path: |
            scrape-output/*.json
            scrape-output/*.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] An Phat (API)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # Job DUY NHAT duoc ghi vao Google Sheet. Chi chay SAU KHI ca 3 job scrape
  # da xong (needs), va van chay du 1/2 job scrape bi fail (if: always()) —
  # ghi best-effort voi du lieu cua nhung dealer thanh cong, con hon khong
  # ghi gi (giu triet ly STOP-AND-STABILIZE tu v3.4.10: listing on dinh uu
  # tien hon la doi cho hoan hao).
  write-sheet:
    needs: [scrape-mbw, scrape-cps, scrape-pv, scrape-pv-api, scrape-fpt, scrape-fpt-online, scrape-pv-online, scrape-apc]
    if: ${{ always() && (inputs.run_scrape || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download tat ca artifact tu 3 job scrape
        uses: actions/download-artifact@v4
        with:
          path: scrape-artifacts

      - name: Combine + ghi Sheet (1 lan duy nhat)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SCRAPE_DEALERS: MBW,CPS,PV,APC
          COMBINE_MODE: 'true'
          COMBINE_INPUT_DIR: scrape-artifacts
          # [FORK thanhanphatpc/laptopspects] Chi bat khi tick input
          # first_run_allow_empty (lan dau Sheet con trong) - binh thuong la ''.
          ALLOW_EMPTY_EXISTING: ${{ inputs.first_run_allow_empty && 'true' || '' }}
        shell: bash
        run: set -o pipefail; npm start 2>&1 | tee combine-write-debug.log

      - name: Neu buoc tren that bai, luu log de chan doan
        if: failure() || cancelled()
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          tail -c 20000 combine-write-debug.log > combine-write-debug-tail.log 2>/dev/null || cp combine-write-debug.log combine-write-debug-tail.log
          git add combine-write-debug-tail.log
          git commit -m "chore(debug): write-sheet failed, log chan doan [skip ci]" || echo "nothing"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Export snapshot dashboard/data.csv (tinh enrichment bang code, khong doc Dailly SRP Tracking)
        if: always()
        continue-on-error: true
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          COMBINE_INPUT_DIR: scrape-artifacts
        run: node enrich-and-export.js

      - name: Commit + push data.csv / debug log nếu có thay đổi
        if: always()
        continue-on-error: true
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          ADDED=0
          if [ -f dashboard/data.csv ] && [ -n "$(git status --porcelain dashboard/data.csv)" ]; then
            git add dashboard/data.csv
            ADDED=1
          fi
          if [ -f dashboard/.enrich-debug.log ] && [ -n "$(git status --porcelain dashboard/.enrich-debug.log)" ]; then
            git add dashboard/.enrich-debug.log
            ADDED=1
          fi
          if [ "$ADDED" = "1" ]; then
            git commit -m "chore(dashboard): cap nhat data snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Da push"
          else
            echo "Khong co file nao thay doi, bo qua commit"
          fi

      # 18/08/2026: canh bao SUT COVERAGE. Bai hoc tu su co PV 14/08 - scraper
      # rot 45% SP nhung job van "success" nen Telegram van bao OK, mat 4 ngay
      # moi phat hien. Buoc nay doc cac file coverage-*.txt do scraper ghi ra
      # (khi so SP < 85% median 7 ngay) va gui 1 tin canh bao RIENG, tach khoi
      # tin bao trang thai job de khong bi luot qua.
      - name: Canh bao sut coverage (neu co)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          WARN=$(cat scrape-artifacts/*/coverage-*.txt 2>/dev/null || true)
          if [ -z "$WARN" ]; then
            echo "Khong co canh bao coverage - tat ca dealer dat nguong"
            exit 0
          fi
          echo "$WARN"
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then exit 0; fi
          BODY=$(echo "$WARN" | sed 's/$/%0A/' | tr -d '\n')
          MSG="[CANH BAO] SUT COVERAGE SCRAPE - run #${RUN_NUMBER}%0A%0A${BODY}%0AKiem tra log job scrape cua dealer tuong ung."
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Gui canh bao that bai"

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Chua dat OPS_BOT_TOKEN/OPS_CHAT_ID - bo qua bao cao"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] GHI SHEET (combine MBW+CPS+FPT+PV)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"

  # 06/08/2026: Trigger RIENG - CHI re-enrich dashboard/data.csv tu Part#
  # moi nhat (khong scrape gi ca). Dung khi Phuc vua sua Part# (Focus Model,
  # Series Group, CPU Segment...) va muon dashboard cap nhat NGAY, khong doi
  # lan scrape sau (~20-25 phut). Job nay doc lai TOAN BO data.csv hien co,
  # tra cuu Part#/Segment ban moi nhat, ghi de cot enrichment - khong dung
  # gi den cot RAW (gia/model/link). Nam trong CUNG file scrape.yml de trigger
  # tu 1 noi duy nhat, nhung hoan toan doc lap voi pipeline scrape (khong
  # needs job nao ben tren, chi mat ~30-60s vi khong can Puppeteer/Chrome).
  reenrich-dashboard:
    name: Re-enrich dashboard/data.csv tu Part# (khong scrape)
    if: ${{ inputs.run_reenrich_dashboard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install googleapis (khong can Puppeteer)
        run: npm install googleapis@140 --no-save --no-audit --no-fund

      - name: Re-enrich data.csv
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node reenrich-dashboard-csv.js

      - name: Commit + push data.csv neu co thay doi
        if: always()
        run: |
          git config user.name "msi-data-bot"
          git config user.email "actions@users.noreply.github.com"
          ADDED=0
          if [ -f dashboard/data.csv ] && [ -n "$(git status --porcelain dashboard/data.csv)" ]; then
            git add dashboard/data.csv
            ADDED=1
          fi
          if [ -f dashboard/.reenrich-debug.log ] && [ -n "$(git status --porcelain dashboard/.reenrich-debug.log)" ]; then
            git add dashboard/.reenrich-debug.log
            ADDED=1
          fi
          if [ "$ADDED" = "1" ]; then
            git commit -m "chore(dashboard): re-enrich tu Part# moi nhat (trigger rieng, khong scrape) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Da push"
          else
            echo "Khong co thay doi, bo qua commit"
          fi

      - name: Bao cao ve Telegram
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          CHAT: ${{ secrets.OPS_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then ICON="OK"; else ICON="FAIL"; fi
          MSG="[$ICON] Re-enrich dashboard tu Part# (khong scrape)%0Atrang thai: ${JOB_STATUS}%0Arun #${RUN_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=${MSG}" \
            -o /dev/null -w "telegram: %{http_code}\n" || echo "Bao cao that bai nhung khong sao"
